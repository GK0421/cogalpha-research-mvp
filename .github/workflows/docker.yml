name: Docker Build

on:
  push:
    branches: [main]
    paths:
      - 'docker/**'
      - 'apps/**'
      - 'src/**'
      - 'pyproject.toml'
      - '.dockerignore'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.api
          push: false
          tags: cogalpha-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.web
          push: false
          tags: cogalpha-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test docker-compose
        run: |
          cd docker
          docker compose build
          docker compose up -d
          sleep 10
          curl -s http://127.0.0.1:8765/api/health | grep -q "ok"
          curl -s http://127.0.0.1:8080/ | grep -q "html"
          docker compose down
