name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'apps/api/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'pytest.ini'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'apps/api/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'pytest.ini'

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11']

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check src tests apps/api

      - name: Ruff format check
        run: ruff format --check src tests apps/api

      - name: Mypy
        run: mypy src apps/api

      - name: Pytest with coverage
        run: |
          pytest `
            --cov=src/cogalpha_mvp `
            --cov=apps/api `
            --cov-report=term-missing `
            --cov-report=xml `
            --cov-fail-under=85 `
            -m "not slow"
        shell: pwsh

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-${{ matrix.os }}
          path: coverage.xml
