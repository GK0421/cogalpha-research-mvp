# docker/docker-compose.yml
# CogAlpha Studio - Docker Compose (API + Web)

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: cogalpha-api
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - cogalpha-workspace:/home/cogalpha/.cogalpha
    environment:
      - COGALPHA_HOME=/home/cogalpha/.cogalpha
      - COGALPHA_TELEMETRY_ENABLED=false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    container_name: cogalpha-web
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  cogalpha-workspace:
