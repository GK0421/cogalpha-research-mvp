# Docker Compose for CogAlpha Studio v0.2.0
# Usage: docker-compose up

services:
  cogalpha-studio:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - cogalpha-data:/root/.cogalpha
    environment:
      - COGALPHA_HOST=0.0.0.0
      - COGALPHA_PORT=8765
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  cogalpha-data:
