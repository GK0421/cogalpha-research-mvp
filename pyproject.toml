[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cogalpha-mvp"
version = "0.1.0"
description = "Reproducible and leakage-aware quantitative factor research MVP for A-share research"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "GK0421"}]
keywords = ["quantitative-finance", "factor-investing", "alpha-research", "backtesting", "a-share"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "click>=8.1",
    "rich>=13.0",
    "pyarrow>=10.0",
    "sqlalchemy>=2.0",
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "python-multipart>=0.0.6",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "mypy>=1.0",
    "pip-audit>=2.7",
    "httpx>=0.24",
]
llm = [
    "openai>=1.0",
]

[project.scripts]
cogalpha = "cogalpha_mvp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001", "B008", "RUF012", "SIM103", "SIM108"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
mypy_path = "src"
namespace_packages = true

[[tool.mypy.overrides]]
module = ["cogalpha_mvp.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "e2e: marks tests as end-to-end tests",
]

[tool.coverage.run]
source = ["src/cogalpha_mvp"]
omit = ["tests/*", "*/__init__.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
