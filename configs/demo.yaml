# CogAlpha Research MVP - Demo Configuration
# Shorter time range for quick demo runs.

data:
  full_start: "2022-01-01"
  full_end: "2022-06-30"
  train_start: "2022-01-01"
  train_end: "2022-03-31"
  oos_start: "2022-04-01"
  oos_end: "2022-06-30"

factors:
  qualified_score_threshold: 0.65
  elite_score_threshold: 0.80
  min_ic_qualified: 0.005
  min_icir_qualified: 0.05
  min_rankic_qualified: 0.005
  min_rankicir_qualified: 0.05
  min_ic_elite: 0.01
  min_icir_elite: 0.10
  min_rankic_elite: 0.01
  min_rankicir_elite: 0.10
  return_label: "next_1d_return"
  forward_period: 1

dedup:
  absolute_correlation_threshold: 0.85
  structural_dedup: true
  numerical_dedup: true

portfolio:
  top_quantile: 0.2
  bottom_quantile: 0.2
  rebalance: "weekly"
  transaction_cost_bps: 10
  slippage_bps: 5
  max_single_weight: 0.05

quality:
  min_valid_ratio: 0.3
  max_nan_ratio: 0.7
  near_constant_threshold: 1.0e-8
  truncation_test_dates: 5
  truncation_max_diff: 1.0e-10
  truncation_min_corr: 0.9999
  max_complexity: 100

generation:
  enabled: false

seed: 42
output_dir: "results"
log_level: "INFO"
